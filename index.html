<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Led Anbar</title>
    <link class="image-style" rel="icon" type="image/png" href="./favicon.png?v=2">
    <link class="image-style" rel="shortcut icon" type="image/png" href="./favicon.png?v=2">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

    <!-- Eastern Star Tətbiqdaxili Modal -->
    <div id="easternStarModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; justify-content: center; align-items: center; padding: 10px; box-sizing: border-box;">
        <div style="background: #1e1f22; width: 100%; max-width: 900px; height: 85vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.5);">
            <!-- Modal Başlığı -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #2b2d31; border-bottom: 1px solid #3f4147;">
                <span style="color: white; font-weight: bold; font-size: 15px;">Eastern Star Axtarış</span>
                <button id="closeEasternStarModal" style="background: #f44336; border: none; color: white; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;">Bağla</button>
            </div>
            <!-- Saytın açılacağı çərçivə (Iframe) -->
            <div style="flex: 1; width: 100%; height: 100%; background: white;">
                <iframe id="easternStarIframe" src="" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>
    </div>

    <div id="fullImageModal" class="full-image-modal" style="display: none;">
        <span class="full-image-close">&times;</span>
        <img class="full-image-content" id="fullScreenImg">
    </div>

    <!-- 🎯 Header Həmişə görünür -->
    <header>
        <div id="normalHeader" class="header-panel">
            <h1>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="currentColor" style="vertical-align: middle; margin-right: 8px;">
                    <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v1c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-1h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/>
                    <path d="M10 19h4v1h-4z"/>
                </svg>
                Led Anbar
            </h1>
        </div>
    </header>

    <main class="main-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Led model...">
        </div>

        <!-- 1. Tablar -->
        <div class="tab-container">
            <button id="tabAnbar" class="tab-btn active-tab">📦 Anbar</button>
            <button id="tabZakaz" class="tab-btn">📝 Zakazlar</button>
        </div>

        <!-- 🌐 Eastern Star üçün Kiçik Pəncərə Düyməsi -->
        <div style="text-align: center; margin-bottom: 10px;">
            <button id="btnOpenEasternStar" style="background-color: #007bff; border: none; color: white; padding: 6px 12px; font-size: 13px; border-radius: 8px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5z"/>
                    <path d="M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0v-5z"/>
                </svg>
                Eastern Star
            </button>
        </div>

        <!-- 2. Siyahı Başlığı və Birbaşa WhatsApp Düyməsi -->
        <div class="title-container" style="display: flex; align-items: center; justify-content: center; gap: 12px; margin: 20px auto 10px auto; flex-wrap: wrap;">
            <h2 id="listTitle" style="margin: 0; display: inline-block;">Anbardakı LED-lər</h2>
            <button id="btnSendWhatsApp" style="display: none; background: transparent; border: 1px solid #25d366; color: #25d366; padding: 6px 14px; font-size: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s; align-items: center; justify-content: center; gap: 8px; font-family: inherit;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#25D366" d="M12.004 2c-5.51 0-9.993 4.483-9.993 9.993a9.94 9.94 0 0 0 1.357 5.002L2 22l5.138-1.348a9.927 9.927 0 0 0 4.866 1.28c5.51 0 10-4.49 10-10S17.514 2 12.004 2z"/>
                    <path fill="#FFF" d="M16.918 14.884c-.265-.133-1.564-.772-1.807-.86-.243-.088-.42-.133-.596.133-.177.265-.685.86-.84 1.037-.154.177-.31.199-.574.066-.265-.133-1.12-.413-2.133-1.317-.788-.703-1.32-1.572-1.474-1.837-.155-.265-.017-.408.116-.54.12-.12.265-.31.398-.464.133-.155.177-.265.265-.442.089-.177.044-.332-.022-.464-.066-.133-.597-1.437-.818-1.967-.215-.518-.432-.447-.596-.456-.153-.008-.33-.008-.508-.008-.177 0-.464.066-.707.331-.243.265-.928.906-.928 2.21 0 1.303.95 2.563 1.083 2.74 1.143 1.503 2.503 2.314 3.743 2.775 1.24.461 1.24.308 1.5.284.259-.024.832-.336.949-.661.119-.324.119-.603.084-.662-.036-.059-.143-.095-.433-.24z"/>
                </svg>
                WhatsApp ilə Göndər
            </button>
        </div>

        <!-- 3. 🎯 Seçim və Silmə Paneli -->
        <div id="selectionHeader" class="selection-panel">
            <div class="selection-left">
                <button id="btnCancelSelection" class="icon-btn">✕</button>
                <span id="selectionCount">0 seçildi</span>
            </div>
            <div class="selection-actions">
                <button id="btnChangeSelectedQty" class="action-btn-outline" style="border-color: #f39c12; color: #f39c12;">Sayı Dəyiş</button>
                <button id="btnSelectAll" class="action-btn-outline">Hamısını Seç</button>
                <button id="btnDeleteSelected" class="action-btn-danger">Sil</button>
            </div>
        </div>

        <div id="loadingContainer" class="loader-container" style="display: none;">
            <div class="spinner"></div>
            <p>Məlumatlar yüklənir...</p>
        </div>

        <div id="ledList" class="led-grid"></div>
    </main>

    <button id="openModalBtn" class="fab-btn">+</button>

    <!-- Modallar -->
    <div id="choiceModal" class="modal-overlay" style="display: none;">
        <div class="modal-content choice-box">
            <h3>Seçim Edin</h3>
            <button id="btnCreateNew" class="menu-btn blue-btn">➕ Yeni LED</button>
            <button id="btnSelectFromAnbar" class="menu-btn green-btn">📦 Zakaz yaz</button>
        </div>
    </div>

    <!-- Yeni və Redaktə Modalı -->
    <div id="addModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="modalTitle">Yeni LED Əlavə Et</h3>
            <div id="modalAlert" class="modal-alert" style="display: none;"></div>
            
            <div class="form-group">
                <label>LED Model</label>
                <input type="text" id="ledName" placeholder="Məs: ES-047">
            </div>
            <div class="form-group">
                <label>Qutu Nömrəsi</label>
                <input type="text" id="boxNumber" placeholder="Məs: 15">
            </div>
            <!-- ⚡ Sənin kodunda çatışmayan 'ledVolt' sahəsini bura əlavə etdim[cite: 7] -->
            <div class="form-group">
                <label>Volt (Gərginlik)</label>
                <input type="text" id="ledVolt" placeholder="Məs: 3 və ya 6">
            </div>
            <div class="form-group">
                <label>Qiymət</label>
                <input type="number" id="ledPrice" placeholder="Məs: 45">
            </div>
            <div class="form-group">
                <label>Şəkil URL</label>
                <input type="text" id="ledImageUrl" placeholder="https://...">
            </div>
            <div class="form-group file-upload-group">
                <label class="file-label" for="ledFileInput">Fayldan Şəkil Yüklə</label>
                <input type="file" id="ledFileInput" accept="image/*" style="display: none;">
                <span id="fileSelectedName"></span>
            </div>

            <div class="modal-actions">
                <button id="saveBtn" class="action-btn success">Yadda Saxla</button>
                <button id="deleteBtn" class="action-btn danger" style="display: none;">Sil</button>
                <button id="closeModalBtn" class="action-btn cancel">Ləğv Et</button>
            </div>
        </div>
    </div>

    <div id="anbarSelectModal" class="modal-overlay" style="display: none;">
        <div class="modal-content list-select-box">
            <h3>Anbardan Mal Seçin</h3>
            <input type="text" id="anbarSearchInput" placeholder="Anbarda axtar..." class="modal-search">
            <div id="anbarSelectContainer" class="modal-scroll-list"></div>
            <button id="closeAnbarSelectBtn" class="action-btn cancel" style="width:100%; margin-top:10px;">Bağla</button>
        </div>
    </div>

    <div id="countModal" class="modal-overlay" style="display: none;">
        <div class="modal-content count-box">
            <h3 id="countModalModelName">Model Adı</h3>
            <div class="form-group">
                <label>Sifariş Sayını Yazın (Ədəd)</label>
                <input type="number" id="zakazCountInput" value="1" min="1">
            </div>
            <div class="modal-actions">
                <button id="btnConfirmZakaz" class="action-btn success">Sifariş Siyahısına Əlavə Et</button>
                <button id="closeCountBtn" class="action-btn cancel">Geri</button>
            </div>
        </div>
    </div>

    <div id="imagePreviewModal" class="modal-overlay" style="display: none;">
        <div class="modal-content preview-box">
            <h3 id="previewTitle">LED Detalları</h3>
            <div class="preview-img-container">
                <img id="previewImage" src="" alt="Önizləmə">
            </div>
            <div class="preview-info" style="display: flex; flex-direction: column; gap: 8px; align-items: center;">
                <p>Qutu Nömrəsi: <span id="previewBox" class="box-badge">-</span></p>
                <!-- ⚡ Önbaxışda volt dəyərini görmək üçün bura element əlavə etdim[cite: 7] -->
                <p>Volt: <span id="previewVolt" class="box-badge" style="background-color: #007bff; color: white;">-</span></p>
                <p>Qiymət: <span id="previewPrice" class="price-badge">-</span></p>
            </div>
            <div class="modal-actions horizontal">
                <button id="goToEditBtn" class="action-btn edit-btn">✏️ Məlumatı Yenilə</button>
                <button id="closePreviewBtn" class="action-btn cancel">Bağla</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js?v=4"></script>
</body>
</html>
